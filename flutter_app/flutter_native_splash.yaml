flutter_native_splash:
  # L'écran natif doit être indiscernable de l'écran Dart qui lui succède,
  # sinon on voit un logo remplacer l'autre — c'est ce qui se passait : deux
  # secondes d'ancien logo sur blanc, puis un fondu vers le nouveau.
  #
  # Mêmes fonds que `AppColors.backgroundWhite`, même logotype, même taille
  # (240 points de large, soit 960 px : l'outil traite la source comme du
  # @4x et en sort un @3x aux trois quarts).
  color: "#FAFAFA"
  color_dark: "#08080A"

  image: assets/splash/lockup_light.png
  image_dark: assets/splash/lockup_dark.png

  ios_content_mode: center
  android_gravity: center

  fullscreen: false

  android_12:
    color: "#FAFAFA"
    color_dark: "#08080A"
    image: assets/splash/lockup_light.png
    image_dark: assets/splash/lockup_dark.png
    icon_background_color: "#FAFAFA"
    icon_background_color_dark: "#08080A"
