flutter_native_splash:
  # L'écran natif est le premier plan de la vidéo de lancement : du noir, et
  # rien d'autre. La vidéo commence sur ce noir et fait apparaître le logo ;
  # un logo déjà posé ici disparaîtrait pour réapparaître, et un fond blanc
  # (thème clair) virerait au noir d'un coup.
  #
  # Même noir en clair et en sombre : la vidéo ne suit pas le thème.
  color: "#000000"
  color_dark: "#000000"

  fullscreen: false

  # Android 12+ impose une icône au centre de son écran de lancement. Elle est
  # transparente : sinon le logo de l'app s'afficherait une fraction de
  # seconde, puis s'effacerait quand la vidéo démarre sur du noir.
  android_12:
    color: "#000000"
    color_dark: "#000000"
    image: assets/splash/android12_blank.png
    icon_background_color: "#000000"
    icon_background_color_dark: "#000000"
