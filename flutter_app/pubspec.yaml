name: aji_tfarraj
description: Aji Tfarraj Mobile App - TV Show Reservation System
publish_to: 'none'
version: 1.1.17+54

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  go_router: ^13.0.0
  cupertino_icons: ^1.0.6
  # API & Networking
  dio: ^5.4.0
  # Error monitoring & performance (iOS + Android)
  sentry_flutter: ^8.9.0
  # Secure token storage
  flutter_secure_storage: ^9.0.0
  # Image caching
  cached_network_image: ^3.3.1
  # Date formatting
  intl: ^0.20.2
  # QR Code generation
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  # Native rating prompt (App Store / Play), quota-limited by the stores themselves
  in_app_review: ^2.0.12
  # Local caching
  shared_preferences: ^2.2.2
  # Firebase & Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  # Analytics
  firebase_analytics: ^11.3.3
  image_picker: ^1.2.1
  # Custom camera capture with a face-guide frame for the avatar
  camera: ^0.11.1
  # Normalize (bake EXIF orientation + resize) captured photos so ML Kit face
  # detection works and the avatar isn't stored sideways
  image: ^4.3.0
  # On-device face detection to validate the avatar is a real face (no network)
  google_mlkit_face_detection: ^0.13.1
  # Social authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  # QR code scanning (staff check-in)
  mobile_scanner: ^7.0.0

  # Deep linking & Sharing
  app_links: ^6.1.0
  share_plus: ^10.0.0

  flutter_native_splash:
    ^2.4.0
  video_player: ^2.11.1
  chewie: ^1.13.0
  path_provider: ^2.1.5
  flutter_web_auth_2: ^5.0.1
  # App version gate (compare installed vs backend latest/min)
  package_info_plus: ^8.0.0
  # Biometric unlock (Face ID / Touch ID / fingerprint)
  local_auth: ^2.3.0
  # Deferred deep-link attribution (CP referral): Android Play Install Referrer.
  # iOS uses the clipboard (flutter/services) — no plugin needed there.
  android_play_install_referrer: ^0.4.0
  # Open the OS app-settings page (deep-link users to enable camera/photos when
  # a permission was previously denied). Lightweight, no iOS Podfile macros.
  app_settings: ^5.1.1

  # Shuttle manifest export. Pure Dart (no native plugin): it writes the bytes,
  # share_plus hands the file off.
  pdf: ^3.11.0
  google_mlkit_pose_detection: ^0.14.1
  google_mobile_ads: ^9.1.0

# Force the pre-Credential-Manager google_sign_in_android.
# 6.2.x migrated to androidx.credentials.CredentialManager, which hangs
# forever on many devices (Xiaomi/Redmi/Samsung) when the Play Services
# version, device-locale, or multi-account state is imperfect. 6.1.36 is
# the last version using the classic GoogleSignInClient activity flow,
# which is far more reliable in production.
dependency_overrides:
  google_sign_in_android: 6.1.36
  # 2.4.23 ships a newer-style Gradle module (its own settings.gradle.kts, AGP
  # 8.13.1, Kotlin 2.3.0) that this project's AGP 8.11.1 never configures: the
  # module is not compiled and SharedPreferencesPlugin is missing at javac time.
  # 2.4.21 is the first version carrying the datastore 1.1.7 revert — the 16 ko
  # fix — and still builds here. Remove when the project moves to AGP 9.
  shared_preferences_android: 2.4.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  # Le carré est plein et sans coins arrondis : iOS applique son propre
  # masque, et une icône déjà arrondie s'y verrait deux fois.
  image_path: "assets/icon/app_icon.png"
  # Android découpe l'avant-plan en cercle : le symbole y est réduit à 66 %
  # pour ne pas se faire rogner les angles.
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  min_sdk_android: 21
  remove_alpha_channel: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/ajitfarraj_logo/
    # Les .ttf de Cairo restent aussi déclarés en assets : l'export PDF du
    # manifeste les lit par chemin (rootBundle.load), pas par famille.
    - assets/fonts/

  # Cairo, embarqué dans l'app — jamais téléchargé.
  #
  # Avant, google_fonts allait chercher Inter et Cairo chez Google au premier
  # affichage : sur un réseau lent l'app démarrait dans la police du système
  # puis changeait de police sous les yeux du membre, et hors ligne elle
  # n'avait jamais la bonne. C'est ce que fait Airbnb, Spotify ou Netflix :
  # la police de la marque est dans le binaire.
  #
  # Quatre coupes, générées depuis la police variable amont (OFL) et réduites
  # au latin + arabe : ~82 Ko chacune. Ce sont les quatre graisses que la
  # charte utilise réellement — 400 pour le corps arabe, 600 pour les titres
  # arabes, 700 pour les titres de carte, 800 pour les grands titres.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
